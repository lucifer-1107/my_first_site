<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>My Photo Vault</title>
<style>
:root{
  --bg:#eef1f0; --card:#ffffff; --ink:#1c2b27; --muted:#5d6d68;
  --accent:#1f6f5c; --accent-ink:#ffffff; --line:#d3dbd8; --danger:#b3372f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a18; --card:#1d2623; --ink:#e8efec; --muted:#9aaaa4; --accent:#4fb89c; --accent-ink:#0d1b17; --line:#2c3935; --danger:#ef7b72; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
header{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:20px 16px 8px; max-width:1100px; margin:0 auto;
}
h1{font-family:Georgia,"Times New Roman",serif; font-size:1.7rem; margin:0; letter-spacing:-.01em}
.count{color:var(--muted); font-size:.95rem; margin-top:2px}
.btn{
  appearance:none; border:0; border-radius:10px; padding:12px 18px; font:inherit; font-weight:600;
  background:var(--accent); color:var(--accent-ink); cursor:pointer; min-height:44px;
}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
main{max-width:1100px; margin:0 auto; padding:8px 16px 40px}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px}}
.tile{
  padding:0; border:0; background:var(--card); border-radius:10px; overflow:hidden;
  aspect-ratio:1/1; cursor:pointer; display:block; width:100%;
}
.tile img{width:100%; height:100%; object-fit:cover; display:block}
.empty{
  border:2px dashed var(--line); border-radius:14px; padding:48px 20px; text-align:center; color:var(--muted); margin-top:16px;
}
.empty strong{display:block; color:var(--ink); font-size:1.15rem; margin-bottom:6px}
.status{min-height:1.4em; color:var(--muted); font-size:.9rem; padding:4px 16px; max-width:1100px; margin:0 auto}
#viewer{
  position:fixed; inset:0; background:rgba(8,12,11,.96); display:none; flex-direction:column; z-index:10;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#viewer.open{display:flex}
.vbar{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; color:#e8efec}
.vbar .btn{background:#2a3632; color:#e8efec; border:0}
.vbar .btn.danger{color:#ff9b93; background:#2a3632}
.vname{font-size:.9rem; opacity:.8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:center}
.stage{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; touch-action:pan-y}
.stage img{max-width:100%; max-height:100%; object-fit:contain}
.nav{
  position:absolute; top:50%; transform:translateY(-50%); width:48px; height:64px; border:0; border-radius:10px;
  background:rgba(255,255,255,.14); color:#fff; font-size:1.6rem; cursor:pointer;
}
.nav.prev{left:8px} .nav.next{right:8px}
@media(max-width:600px){.nav{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <h1>My Photo Vault</h1>
    <div class="count" id="count">0 photos</div>
  </div>
  <div>
    <button class="btn" id="addBtn">Add photos</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>
</header>
<div class="status" id="status" role="status" aria-live="polite"></div>

<main>
  <div class="empty" id="empty" hidden>
    <strong>No photos yet</strong>
    Tap “Add photos” to save your first one.
  </div>
  <div class="grid" id="grid"></div>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="vbar">
    <button class="btn" id="closeBtn">Close</button>
    <div class="vname" id="vname"></div>
    <button class="btn" id="dlBtn">Download</button>
    <button class="btn danger" id="delBtn">Delete</button>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="Previous photo">&#8249;</button>
    <img id="vimg" alt="">
    <button class="nav next" id="next" aria-label="Next photo">&#8250;</button>
  </div>
</div>

<script>
(function(){
  var DB_NAME='photo-vault', STORE='photos', db=null;
  var photos=[], urls=[], current=-1, viewerUrl=null;
  var $=function(id){return document.getElementById(id)};

  function openDB(){
    return new Promise(function(res,rej){
      var r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=function(){r.result.createObjectStore(STORE,{keyPath:'id'})};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    });
  }
  function tx(mode){return db.transaction(STORE,mode).objectStore(STORE)}
  function reqP(r){return new Promise(function(res,rej){r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}

  function makeThumb(file){
    return new Promise(function(res){
      var img=new Image(), u=URL.createObjectURL(file);
      img.onload=function(){
        var s=400/Math.max(img.width,img.height); if(s>1)s=1;
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(function(b){URL.revokeObjectURL(u);res(b||file)},'image/jpeg',0.8);
      };
      img.onerror=function(){URL.revokeObjectURL(u);res(file)};
      img.src=u;
    });
  }

  function say(t){$('status').textContent=t||''}

  async function load(){
    var all=await reqP(tx('readonly').getAll());
    all.sort(function(a,b){return b.added-a.added});
    photos=all; render();
  }

  function render(){
    urls.forEach(URL.revokeObjectURL); urls=[];
    var g=$('grid'); g.innerHTML='';
    photos.forEach(function(p,i){
      var u=URL.createObjectURL(p.thumb); urls.push(u);
      var b=document.createElement('button'); b.className='tile'; b.setAttribute('aria-label','Open '+p.name);
      var im=document.createElement('img'); im.src=u; im.alt=p.name; im.loading='lazy';
      b.appendChild(im); b.onclick=function(){openViewer(i)}; g.appendChild(b);
    });
    $('count').textContent=photos.length+(photos.length===1?' photo':' photos');
    $('empty').hidden=photos.length>0;
  }

  async function addFiles(files){
    var list=Array.from(files).filter(function(f){return f.type.indexOf('image/')===0});
    if(!list.length){say('Please choose image files.');return}
    var done=0;
    for(var f of list){
      say('Saving '+(done+1)+' of '+list.length+'…');
      try{
        var thumb=await makeThumb(f);
        var rec={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),name:f.name||'photo',type:f.type,added:Date.now()+done,blob:f,thumb:thumb};
        await reqP(tx('readwrite').put(rec)); done++;
      }catch(e){
        say('Could not save '+f.name+'. Your device may be out of storage.'); await load(); return;
      }
    }
    say(done+(done===1?' photo saved.':' photos saved.'));
    await load();
  }

  function openViewer(i){
    current=i; var p=photos[i];
    if(viewerUrl)URL.revokeObjectURL(viewerUrl);
    viewerUrl=URL.createObjectURL(p.blob);
    $('vimg').src=viewerUrl; $('vimg').alt=p.name; $('vname').textContent=p.name;
    $('viewer').classList.add('open'); $('closeBtn').focus();
  }
  function closeViewer(){
    $('viewer').classList.remove('open');
    if(viewerUrl){URL.revokeObjectURL(viewerUrl);viewerUrl=null}
    $('vimg').removeAttribute('src');
  }
  function step(d){
    if(!photos.length)return;
    openViewer((current+d+photos.length)%photos.length);
  }
  async function del(){
    var p=photos[current]; if(!p)return;
    if(!confirm('Delete “'+p.name+'”? This cannot be undone.'))return;
    await reqP(tx('readwrite').delete(p.id));
    closeViewer(); say('Photo deleted.'); await load();
  }
  function download(){
    var p=photos[current]; if(!p)return;
    var a=document.createElement('a'); a.href=URL.createObjectURL(p.blob); a.download=p.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  }

  $('addBtn').onclick=function(){$('file').click()};
  $('file').onchange=function(e){addFiles(e.target.files); e.target.value=''};
  $('closeBtn').onclick=closeViewer;
  $('prev').onclick=function(){step(-1)};
  $('next').onclick=function(){step(1)};
  $('delBtn').onclick=del;
  $('dlBtn').onclick=download;
  document.addEventListener('keydown',function(e){
    if(!$('viewer').classList.contains('open'))return;
    if(e.key==='Escape')closeViewer();
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  });
  var sx=null;
  $('stage').addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  $('stage').addEventListener('touchend',function(e){
    if(sx===null)return; var dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)>60)step(dx<0?1:-1);
  });

  (async function init(){
    if(!window.indexedDB){say('This browser cannot store photos. Try Chrome, Safari or Firefox.');return}
    try{
      db=await openDB();
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
      await load();
    }catch(e){say('Storage is unavailable. Turn off private browsing and reload.')}
  })();
})();
</script>
</body>
</html>
